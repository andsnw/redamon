# RedAmon recon settings registry.
#
# The one hand-maintained description of every recon parameter. See README.md
# beside this file for what belongs here and what stays in Prisma.
#
# `type` and `default` are DELIBERATELY absent: Prisma owns them and the build
# joins them, so a value that already has two definitions never gains a third.
