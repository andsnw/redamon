# RedAmon Node Filters scan-time guinea pig
#
# Bring up:   docker compose up -d --build
# Bring down: docker compose down
# Targets:    192.88.96.10-13  (IP mode, one project, one scan)
#
# Four existing guinea pigs, unchanged, on ONE bridge with fixed addresses, so
# a single IP-mode recon produces real findings for six filter kinds at once:
#
#   .10  apache_2.4.49      Nuclei (CVE-2021-41773/42013 + fingerprints),
#                           security-check header findings
#   .11  tls_target         seven TLS-hygiene security-check findings
#   .12  vhost_target       VHost/SNI findings (two internal panels, a co-host)
#   .13  ai_surface_target  AI-surface findings, JS Recon findings, Secrets
#
# WHY A PRIVATE BRIDGE AND NOT THEIR OWN COMPOSE FILES: three of them publish
# host :8080 or run on the host network, so they cannot be up together, and a
# target on 127.0.0.1 also puts RedAmon's own services in the scan.
#
# WHY 192.88.96.0/24: the recon pipeline's Python SSRF guards (js_recon, tlsx)
# reject loopback, RFC1918 and every TEST-NET range, so a lab there yields no
# JS or certificate findings. This block sits beside the 6to4 relay block
# (RFC 7526) the other labs use; Python reports it global, so the guards stay
# armed. It is distinct from js_scope (.97), tls (.98) and supply-chain (.99)
# so all of them can be up at once. Nothing leaves the host.
#
# The recon container and every scan tool run with --net=host, so the bridge
# route Docker installs for this subnet is all they need to reach the targets.

x-caps: &caps
  restart: unless-stopped
  mem_limit: ${NF_LAB_MEM:-256m}
  pids_limit: ${NF_LAB_PIDS:-256}
  cpus: ${NF_LAB_CPUS:-0.5}

services:

  # The official image rather than ../apache_2.4.49's source build: that
  # Dockerfile compiles on debian:bullseye, whose security mirror no longer
  # serves the packages it installs. Same httpd 2.4.49, same config and content.
  # The CGI script is copied in because a read-only mount keeps the host's mode,
  # and it is not executable there.
  nf-apache:
    <<: *caps
    image: httpd:2.4.49
    container_name: redamon-nf-apache
    volumes:
      - ../apache_2.4.49/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ../apache_2.4.49/www:/usr/local/apache2/htdocs:ro
      - ../apache_2.4.49/cgi-bin:/lab/cgi-bin:ro
    command: >-
      sh -c "cp /lab/cgi-bin/* /usr/local/apache2/cgi-bin/
      && chmod 755 /usr/local/apache2/cgi-bin/*
      && exec httpd-foreground"
    networks:
      nf_lab:
        ipv4_address: 192.88.96.10

  nf-tls:
    <<: *caps
    build: ../tls_target
    image: redamon-tls-target:latest
    container_name: redamon-nf-tls
    networks:
      nf_lab:
        ipv4_address: 192.88.96.11

  nf-vhost:
    <<: *caps
    build: ../vhost_target
    image: redamon-vhost-target:latest
    container_name: redamon-nf-vhost
    networks:
      nf_lab:
        ipv4_address: 192.88.96.12

  nf-ai:
    <<: *caps
    build: ../ai_surface_target
    image: redamon-ai-surface-target:latest
    container_name: redamon-nf-ai
    networks:
      nf_lab:
        ipv4_address: 192.88.96.13

networks:
  nf_lab:
    name: redamon_nf_lab
    driver: bridge
    ipam:
      config:
        - subnet: 192.88.96.0/24
          gateway: 192.88.96.1
